<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>UiBlazor</title>
    <base href="/" />
    <link rel="stylesheet" href="concept.css" />
    <link rel="icon" href="data:,">
    <style>#app { height: 100%; }</style>
    <script>
        // Resolves once the frame after the current one is painted.
        window.afterPaint = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    </script>
</head>
<body>
    <div id="app"></div>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
