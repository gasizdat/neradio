schema: spec-driven

context: |
  neradio is a freeware, ad-free internet radio app for Windows and Android only. Linux, macOS
  and iOS are out of scope. Every design and task list covers both Windows and Android.
  Stack: C# and .NET MAUI. The audio engine is chosen by a test on a real Android device; BASS
  (through ManagedBass) is the first candidate.
  The app is MIT-licensed. No GPL-licensed dependency while BASS (closed source) is still an
  audio-engine candidate.
  The brief is doc/entrypoint/UserStory.md: use cases (UCn), features, and the numbered open
  questions (Qn).

rules:
  proposal:
    - Cite the user-story items it covers (UCn, Feature n) and the open questions (Qn) it settles.
    - Where an open question has a proposed default the owner hasn't overruled, use the default and
      say so.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
