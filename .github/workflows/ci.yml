name: CI

on:
  push:
    branches: [main]

  pull_request:

jobs:
  build-and-test:
    # The Windows app only builds on Windows, and the Android app builds there too.
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      # An SDK of our own rather than the runner's in Program Files: there, workloads install as
      # MSIs, along with every one Visual Studio has (iOS, Mac Catalyst, WebAssembly). Here, only
      # the ones the projects need install, from NuGet packages, and the result can be cached.
      DOTNET_INSTALL_DIR: ${{ github.workspace }}\.dotnet

    steps:
      - uses: actions/checkout@v5

      # Keyed on what decides the contents: the SDK channel set below, and the projects' target
      # frameworks and packages.
      - uses: actions/cache@v6
        with:
          path: |
            .dotnet
            ~/.nuget/packages
          key: ${{ runner.os }}-dotnet-${{ hashFiles('.github/workflows/ci.yml', 'src/**/*.csproj', 'tests/**/*.csproj', 'Directory.Packages.props') }}

      # SDK 11 builds the net10.0 projects. It's the one development uses, and the one the runner
      # used before, as the newest it had.
      - name: Setup .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'

      - name: Check formatting
        run: dotnet format whitespace --folder --include src/ tests/ --exclude **/bin/ **/obj/ --verify-no-changes

      - name: Install workloads
        run: dotnet workload restore Neradio.slnx

      - name: Build
        run: dotnet build Neradio.slnx

      # A filter rather than the solution: given the app, newer MAUI workloads make dotnet test
      # ask which device to run it on.
      - name: Test
        run: dotnet test --solution Neradio.Tests.slnf --no-build
