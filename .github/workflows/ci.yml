name: CI

on:
  push:
    branches: [main]

  pull_request:

jobs:
  build-and-test:
    # The Windows app only builds on Windows, and the Android app builds there too.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install workloads
        run: dotnet workload restore Neradio.slnx

      - name: Build
        run: dotnet build Neradio.slnx

      - name: Test
        run: dotnet test Neradio.slnx --no-build
